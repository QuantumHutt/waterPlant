[build]
  command = "npx vite build --config vite.netlify.config.js"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[dev]
  command = "npx vite --config vite.netlify.config.js"
  targetPort = 5173
  framework = "#custom"

# Single-page app: every route is handled by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
